version: 2

models:
  - name: dim_users
    description: "Dimension table containing users."

    columns:
      - name: user_id
        description: "Unique user identifier."
        data_tests:
          - not_null
          - unique

      - name: user_name
        description: "User name."
        data_tests:
          - not_null

      - name: updated_at
        description: "Latest source update timestamp used for incremental processing."
        data_tests:
          - not_null

  - name: dim_status
    description: "Dimension table containing status codes and their descriptions."

    columns:
      - name: status_code
        description: "Unique status code."
        data_tests:
          - not_null
          - unique

      - name: status_name
        description: "Human-readable status name."
        data_tests:
          - not_null
